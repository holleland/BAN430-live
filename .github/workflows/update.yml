name: Update live page

on:
  schedule:
    # Tomorrow's prices are published at about 13:00 Norwegian time (11:00 UTC in summer
    # time, 12:00 UTC after the clocks go back on 25 October). Run every 15 minutes in
    # that window and once an hour otherwise. GitHub can delay scheduled runs a little,
    # so the minutes are not on the hour.
    - cron: "7,22,37,52 10-13 * * *"
    - cron: "17 0-9,14-23 * * *"
  workflow_dispatch:   # the "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1

      - name: Build the page
        run: Rscript build_site.R

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
